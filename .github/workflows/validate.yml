name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON, odkazy, frontmatter, verze
        shell: pwsh
        run: ./scripts/Validate-Repo.ps1

  hooks:
    # Hooky běží u vývojářů na Windows, proto se testují tam.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './evals/hooks'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
